server {
    listen 80;
    server_name localhost;
    client_max_body_size 10M;

    # Статические файлы React (шрифты, изображения и т.д.)
    location /static/ {
        root /app/build;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Статические файлы Django (админка)
    location /static/admin/ {
        alias /staticfiles/admin/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Медиа файлы Django (должно быть ДО регулярных выражений!)
    location /media/ {
        alias /mediafiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API эндпоинты
    location /api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://backend:8000;
    }

    # Django админка
    location /admin/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8000;
    }

    # Кэширование для статических ресурсов React (исключаем /media/)
    location ~* ^/(?!media/).*\.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        root /app/build;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React приложение (должно быть ПОСЛЕДНИМ!)
    location / {
        root /app/build;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}