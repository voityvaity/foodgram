# Rate limiting для API (должно быть в http блоке)
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    server_name localhost;
    client_max_body_size 10M;
    
    # Заголовки безопасности
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    # Статические файлы React (шрифты, изображения и т.д.)
    location /static/ {
        root /app/build;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Статические файлы Django (админка)
    location /static/admin/ {
        alias /staticfiles/admin/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Медиа файлы Django (должно быть ДО регулярных выражений!)
    location /media/ {
        alias /mediafiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # API эндпоинты
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://backend:8000;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Django админка
    location /admin/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend:8000;
    }

    # Кэширование для статических ресурсов React (исключаем /media/)
    location ~* ^/(?!media/).*\.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        root /app/build;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Обработка ошибок
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /app/build;
    }
    
    # React приложение (должно быть ПОСЛЕДНИМ!)
    location / {
        root /app/build;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}