services:
  db:
    image: postgres:13.0-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: feninea/foodgram_backend
    env_file: .env
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_PORT=5432
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
    command: >
      sh -c "echo 'Starting backend...' &&
             ls -la /app/data/ &&
             python manage.py makemigrations &&
             python manage.py migrate &&
             echo 'Loading ingredients...' &&
             python manage.py load_ingredients --verbosity=2 &&
             echo 'Loading tags...' &&
             python manage.py load_tags --verbosity=2 &&
             echo 'Collecting static files...' &&
             python manage.py collectstatic --noinput &&
             echo 'Creating test users...' &&
             python manage.py create_test_users --verbosity=2 &&
             echo 'Creating test recipes...' &&
             python manage.py create_test_recipes --count 12 --verbosity=2 &&
             echo 'Starting Gunicorn...' &&
             gunicorn foodgram.wsgi:application --bind 0.0.0.0:8000"
    restart: unless-stopped

  frontend:
    image: feninea/foodgram_frontend
    volumes:
      - frontend_build:/app/build
    restart: unless-stopped

  nginx:
    image: feninea/foodgram_gateway
    ports:
      - "8080:80"
    volumes:
      - static_volume:/staticfiles
      - media_volume:/mediafiles
      - frontend_build:/app/build
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:
  frontend_build:
